# Multi-UE / multi-cell overlay for the 4G stack. Layer on top of the base compose:
#   docker compose -f deploy/4g/docker-compose.yml -f deploy/4g/docker-compose.multi.yml ...
# Two cells (enb-a, enb-b) and three UEs share one radio medium: the `air` service, a GNU
# Radio flowgraph that weights every UE<->cell link with a gain (config/multi/air.json).
# The air must start LAST and be restarted whenever any eNB or UE restarts (all radio
# endpoints run in one lockstep). The base `enb`/`ue` services are not started here.
#
# FFT cache: srsRAN benchmarks every FFT size when it starts (FFTW_MEASURE) and keeps the result
# in $HOME/.srsran_fftwisdom, written on a clean exit. A fresh container has none, so each eNB/UE
# spent ~3 min benchmarking on every start. Each one gets HOME=/fftw on its own host folder under
# deploy/4g/.fftw/ (git-ignored, survives `down -v`): the first boot on a host is slow, later
# boots take seconds. Delete the folder to re-benchmark (e.g. after moving to another CPU).

# Same image and build as the base file's srsRAN services (anchors don't cross files).
x-srsran-build: &srsran-build
  context: ../..
  dockerfile: deploy/images/srsran.Dockerfile

services:
  # ---- Cell A: enb-a (ue1 and ue2 start in its range) ---------------------
  enb-a:
    image: telecom-poc/srsran:local
    build: *srsran-build
    environment: { HOME: /fftw }  # FFT benchmark cache, see top of file
    command: ["srsenb", "/conf/enb.conf"]
    volumes:
      - "./config/multi/enb-a.conf:/conf/enb.conf:ro"
      - "./.fftw/enb-a:/fftw"
      - "./config/multi/rr-a.conf:/conf/rr.conf:ro"
      - "./config/sib.conf:/conf/sib.conf:ro"
      - "./config/rb.conf:/conf/rb.conf:ro"
      - "./pcap:/pcap"
    networks:
      epc:
        ipv4_address: 172.22.0.40
    depends_on: [mme]

  ue1:
    image: telecom-poc/srsran:local
    build: *srsran-build
    environment: { HOME: /fftw }  # FFT benchmark cache, see top of file
    hostname: iphone-6
    command: ["/scripts/ue-entrypoint.sh", "/conf/ue.conf"]
    volumes:
      - "./config/multi/ue1.conf:/conf/ue.conf:ro"
      - "./.fftw/ue1:/fftw"
      - "./scripts/ue-entrypoint.sh:/scripts/ue-entrypoint.sh:ro"
      - "./pcap:/pcap"
    networks:
      epc:
        ipv4_address: 172.22.0.61
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    depends_on: [enb-a]

  ue2:
    image: telecom-poc/srsran:local
    build: *srsran-build
    environment: { HOME: /fftw }  # FFT benchmark cache, see top of file
    hostname: pixel-8
    command: ["/scripts/ue-entrypoint.sh", "/conf/ue.conf"]
    volumes:
      - "./config/multi/ue2.conf:/conf/ue.conf:ro"
      - "./.fftw/ue2:/fftw"
      - "./scripts/ue-entrypoint.sh:/scripts/ue-entrypoint.sh:ro"
      - "./pcap:/pcap"
    networks:
      epc:
        ipv4_address: 172.22.0.62
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    depends_on: [enb-a]

  # ---- Cell B: enb-b (ue3 starts in its range) -----------------------------
  enb-b:
    image: telecom-poc/srsran:local
    build: *srsran-build
    environment: { HOME: /fftw }  # FFT benchmark cache, see top of file
    command: ["srsenb", "/conf/enb.conf"]
    volumes:
      - "./config/multi/enb-b.conf:/conf/enb.conf:ro"
      - "./.fftw/enb-b:/fftw"
      - "./config/multi/rr-b.conf:/conf/rr.conf:ro"
      - "./config/sib.conf:/conf/sib.conf:ro"
      - "./config/rb.conf:/conf/rb.conf:ro"
      - "./pcap:/pcap"
    networks:
      epc:
        ipv4_address: 172.22.0.50
    depends_on: [mme]

  ue3:
    image: telecom-poc/srsran:local
    build: *srsran-build
    environment: { HOME: /fftw }  # FFT benchmark cache, see top of file
    hostname: samsung-4
    command: ["/scripts/ue-entrypoint.sh", "/conf/ue.conf"]
    volumes:
      - "./config/multi/ue3.conf:/conf/ue.conf:ro"
      - "./.fftw/ue3:/fftw"
      - "./scripts/ue-entrypoint.sh:/scripts/ue-entrypoint.sh:ro"
      - "./pcap:/pcap"
    networks:
      epc:
        ipv4_address: 172.22.0.63
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    depends_on: [enb-b]

  # ---- The agent: fixed actions on this instance for the world map ----------
  # Inventory (from the configs), health, pcaps, live ping and speedtest. Gets the Docker
  # socket, but only exposes its own fixed routes (bearer token AGENT_TOKEN), host-local.
  agent:
    image: telecom-poc/agent:local
    build:
      context: ../../tools/agent
    environment:
      AGENT_TOKEN: "${AGENT_TOKEN:-dev-agent-token}"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./config/multi:/conf:ro"
      - "./pcap:/pcap"
    ports:
      - "127.0.0.1:8091:8091"
    networks:
      epc:
        ipv4_address: 172.22.0.42

  # ---- The air: one shared radio medium for both cells and all UEs ------------
  air:
    build:
      context: ../..
      dockerfile: deploy/images/broker.Dockerfile
    image: telecom-poc/broker:local
    volumes:
      - "./config/multi/air.json:/conf/air.json:ro"
    environment:
      AIR_TOKEN: "${AIR_TOKEN:-dev-air-token}"
      AIR_DEBUG: "${AIR_DEBUG:-}"  # 1: log the engine state every 2 s
    ports:
      - "127.0.0.1:8090:8090"  # control API (bearer token), host-local only
    networks:
      epc:
        ipv4_address: 172.22.0.41
    depends_on: [enb-a, enb-b, ue1, ue2, ue3]
