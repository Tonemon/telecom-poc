[enb]
enb_id = 0x19C
mcc = 999
mnc = 70
mme_addr = 172.22.0.5
gtp_bind_addr = 172.22.0.50
s1c_bind_addr = 172.22.0.50
n_prb = 25

[enb_files]
sib_config = /conf/sib.conf
rr_config  = /conf/rr.conf
rb_config  = /conf/rb.conf

[rf]
device_name = zmq
device_args = log_trx_timeout=true,tx_port=tcp://*:2000,rx_port=tcp://172.22.0.41:2200,id=enb-b,base_srate=11.52e6,rx_max_backlog_ms=20

[pcap]
enable = true
filename = /pcap/enb-b_mac.pcap
s1ap_enable = true
s1ap_filename = /pcap/enb-b_s1ap.pcap

[log]
all_level = info
phy_level = warning
phy_lib_level = warning
filename = stdout

[expert]
