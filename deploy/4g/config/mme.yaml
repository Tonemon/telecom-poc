logger:
  level: info
global:
  max:
    ue: 1024
mme:
  freeDiameter: /usr/local/etc/freeDiameter/mme.conf
  s1ap:
    server:
      - address: 172.22.0.5
  gtpc:
    server:
      - address: 172.22.0.5
    client:
      sgwc:
        - address: 172.22.0.3
      smf:
        - address: 172.22.0.4
  metrics:
    server:
      - address: 172.22.0.5
        port: 9090
  gummei:
    - plmn_id:
        mcc: 999
        mnc: 70
      mme_gid: 2
      mme_code: 1
  tai:
    - plmn_id:
        mcc: 999
        mnc: 70
      tac: 1
  security:
    # Prefer AES (EIA2/EEA2, i.e. 128-EIA2/128-EEA2) over SNOW 3G (EIA1/EEA1)
    # and null (EEA0). The negotiated algorithm is visible in the NAS Security
    # Mode Command — see docs/provisioning.md (§ ciphers) and make capture-4g.
    integrity_order: [ EIA2, EIA1, EIA0 ]
    ciphering_order: [ EEA2, EEA1, EEA0 ]
  network_name:
    full: Open5GS
